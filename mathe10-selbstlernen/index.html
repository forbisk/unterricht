<!DOCTYPE html>
<html lang="de" class="staticrypt-html">
<head>
<meta charset="utf-8">
<title>Mathematik 10a – Selbstlernen (persönlicher Zugang)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<style>
html,body{height:100%;margin:0}
body{font-family:system-ui,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0f766e,#1e3a8a)}
.hidden{display:none!important}
.sc-wrap,.sc-loading{min-height:100%;display:flex;align-items:center;justify-content:center}
.sc-spin{width:44px;height:44px;border:5px solid rgba(255,255,255,.35);border-right-color:#fff;border-radius:50%;animation:sc-r .8s linear infinite}
@keyframes sc-r{to{transform:rotate(360deg)}}
.box{background:#fff;border-radius:18px;padding:32px 36px;max-width:380px;width:90%;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
.lock{font-size:40px}
h1{font-size:20px;margin:6px 0 2px;color:#0f172a}
.sub{margin:4px 0 16px;color:#475569;font-size:14px}
#staticrypt-password{font-family:inherit;width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:2px solid #cbd5e1;border-radius:10px;outline:none}
#staticrypt-password:focus{border-color:#0f766e}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;color:#334155;font-size:15px;cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;accent-color:#0f766e;margin:0}
#staticrypt-button{font-family:inherit;margin-top:12px;width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;cursor:pointer}
#staticrypt-button:disabled{opacity:.7;cursor:progress}
.err{color:#dc2626;min-height:20px;font-size:14px;margin-top:8px}
small{display:block;margin-top:14px;color:#94a3b8}
</style>
</head>

<div id="staticrypt_loading" class="sc-loading"><div class="sc-spin" aria-label="Wird geladen"></div></div>

<div class="lock">🔒</div>

<label id="staticrypt-remember-label" class="remember hidden"><input id="staticrypt-remember" type="checkbox" name="remember" checked> Angemeldet bleiben</label>
<button id="staticrypt-button" type="submit">Öffnen</button>
<div id="staticrypt-error" class="err" role="alert" aria-live="polite"></div>
<small>Das Passwort bekommst du von deinem Lehrer.</small>
</form>
</div>

    rememberPassphraseKey: "tfgs_sc_mathe10-selbstlernen",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null
  };
  var staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
  window.addEventListener("load", async function () {
    var r = await staticrypt.handleDecryptOnLoad();
    if (!r.isSuccessful) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");
      if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
      document.getElementById("staticrypt-password").focus();
    }
  });
  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var inp = document.getElementById("staticrypt-password"),
        btn = document.getElementById("staticrypt-button"),
        err = document.getElementById("staticrypt-error");
    var pw = inp.value.trim();
    if (!pw) { inp.focus(); return; }
    btn.disabled = true; err.textContent = "";
    var r = await staticrypt.handleDecryptionOfPage(pw, document.getElementById("staticrypt-remember").checked);
    if (!r.isSuccessful) {
      btn.disabled = false;
      err.textContent = templateError;
      inp.select();
    }
  });
})();
</script>
</body>
</html>
